<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personalised Webpage</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Welcome to My Personal Page</h1>
    <p>Tell us who you are and we'll personalize it for you!</p>

    <form id="userForm">
      <input
        type="text"
        id="nameInput"
        placeholder="Enter your name"
        required
        aria-required="true"
      />
      <input
        type="number"
        id="ageInput"
        placeholder="Enter your age"
        min="1"
        max="120"
        required
        aria-required="true"
      />
      <button type="submit">Save My Info</button>
      <button type="button" id="clearBtn">Clear Data</button>
    </form>

    <div class="card" id="greetingSection" style="display: none">
      <h2 id="greeting"></h2>
      <p id="ageInMonths"></p>
      <p id="adultMessage"></p>
    </div>
    <div class="card">
      <h3>Daily Motivation</h3>
      <div id="quotes"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
